<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="../css/variables.css">
	<link rel="stylesheet" href="../css/style.css">
	<script src="https://kit.fontawesome.com/88ef4c3fb3.js" crossorigin="anonymous"></script>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>button component</title>
</head>

<body>
	<a href="../index.html">Back to home</a>
	<h1>Default button</h1>
		<div>
			<button class="button solid-default">
				<!--<i class="fa-solid fa-arrow-left"></i>-->
				Active button
				<i class="fa-solid fa-arrow-right"></i>
			</button>

			<button class="button transparent-default">
				<!--<i class="fa-solid fa-arrow-left"></i>-->
				Active button
				<i class="fa-solid fa-arrow-right"></i>
			</button>

			<button class="button outline-default">
				<!--<i class="fa-solid fa-arrow-left"></i>-->
				Active button
				<i class="fa-solid fa-arrow-right"></i>
			</button>

			<button disabled>
				<!--<i class="fa-solid fa-arrow-left"></i>-->
				Disabled button
				<!--<i class="fa-solid fa-arrow-right"></i>-->
			</button>

		</div>

	<h1>Primary button</h1>
		<div>
			<button class="button solid-primary">
				<!--<i style="" class="fa-solid fa-arrow-left"></i>-->
				Active button
				<i class="fa-solid fa-arrow-right"></i>
			</button>

			<button class="button transparent-primary">
				<!--<i style="" class="fa-solid fa-arrow-left"></i>-->
				Active button
				<i class="fa-solid fa-arrow-right"></i>
			</button>

			<button class="button outline-primary">
				<!--<i style="" class="fa-solid fa-arrow-left"></i>-->
				Active button
				<i class="fa-solid fa-arrow-right"></i>
			</button>

			<button disabled>
				<!--<i class="fa-solid fa-arrow-left"></i>-->
				Disabled button
				<!--<i class="fa-solid fa-arrow-right"></i>-->
			</button>

		</div>	
</body>
</html>
